<h1>Aditya Vandan Sharma</h1>
<p>Aditya Vandan Sharma is a full-stack AI software engineer in Bangalore, India, working at Tesco, with earlier work at Rippling, Groww, and Almug.ai. The canonical page is https://adityavandan.github.io/.</p>
<p>I design and ship AI systems that sit inside real products — triage agents, retrieval grounded in production code, and tooling that saves engineering hours every week.</p>
